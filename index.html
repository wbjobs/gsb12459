<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多标签页同步倒计时</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>多标签页同步倒计时</h1>
      <p class="subtitle">在多个标签页 / 窗口中打开本页面，倒计时状态实时同步</p>
    </header>

    <section class="panel peers-panel">
      <h2>在线标签页（<span id="peer-count">1</span>）</h2>
      <ul id="peer-list" class="peer-list"></ul>
    </section>

    <section class="panel">
      <h2>新建倒计时</h2>
      <form id="create-form" class="create-form">
        <input type="text" id="timer-name" placeholder="名称（可选）" maxlength="30">
        <div class="duration-inputs">
          <label><input type="number" id="dur-h" min="0" max="99" value="0"> 时</label>
          <label><input type="number" id="dur-m" min="0" max="59" value="5"> 分</label>
          <label><input type="number" id="dur-s" min="0" max="59" value="0"> 秒</label>
        </div>
        <button type="submit" class="primary">创建</button>
      </form>
    </section>

    <section id="timer-list" class="timer-list"></section>
  </main>

  <script src="js/db.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
